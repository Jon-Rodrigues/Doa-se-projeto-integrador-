<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <src script src="src/js/useracess.js" defer></script>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
     <div class="container_login">
        <div class="lpanel">
            <div class="marca">Sua Marca</div>

      <div class="text">
        <h2>Bem-vindo de volta</h2>
        <p>
          A SUA DOAÇÃO, NOSSA MISSÃO! Doe e faça a diferença na vida de alguém. 
          Juntos, podemos transformar vidas e construir um futuro melhor para todos.
        </p>
        </div>

        </div>

        <div class="rpanel">
            <form action="processar_login" method="post">
                <h1>Login</h1>

                <div class="campo">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <input type="password" id="senha" name="senha" placeholder="Sua senha" required>
                </div>

                <div class="acoes-login">
                    <a class="senha" href="recuperar_senha.html">Esqueceu sua senha?</a>
                </div>

                <button type="submit" class="btn-entrar">Entrar</button>

                <div class="cadastro-area">
                    Não tem uma conta? <a class="regis" href="registro.html">Cadastre-se</a>
                </div>
        

    </div>

</body>
</html>
