<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <src script src="src/js/useracess.js" defer></script>
    <link rel="stylesheet" href="src/css/style.css">
</head>
<body>
    <div class="container">
    <h1>Login</h1>

        <form action="processar_login" method="post">
            <div class="campo"></div>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="seu@email.com" required><br><br>

            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Sua senha" required><br><br>

            <button type="submit">Entrar</button>
        </form><br>

        <a class="regis" href="registro.html">Cadastre-se</a>
        

</body>
</html>
